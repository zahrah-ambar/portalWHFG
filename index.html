<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAC SYSTEM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;font-size:14px;background:#fff;color:#000;}
input,select,textarea{width:100%;border:1px solid #999;padding:6px 8px;font-size:14px;font-family:Arial;}
input:focus,select:focus,textarea:focus{outline:2px solid #000;}
button{padding:7px 16px;font-size:14px;font-family:Arial;cursor:pointer;border:1px solid #000;background:#000;color:#fff;}
button.outline{background:#fff;color:#000;}
button:hover{opacity:.8;}
button:disabled{opacity:.4;cursor:not-allowed;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#000;color:#fff;padding:7px 8px;text-align:left;white-space:nowrap;}
td{padding:7px 8px;border-bottom:1px solid #ddd;vertical-align:middle;}
tr:hover td{background:#f5f5f5;}
.page{display:none;}
.page.on{display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:#000;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.topbar strong{font-size:15px;}
